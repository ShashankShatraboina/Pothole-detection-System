<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Road Damage Classification</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <style>
        .container {
            margin-top: 50px;
        }
        .loader {
            display: none;
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="#">Road Damage Classifier</a>
        </div>
    </nav>

    <div class="container text-center">
        <h2 class="mt-4">Upload an Image for Prediction</h2>
        
        <!-- Image Upload Form -->
        <form id="upload-form" action="/predict" method="post" enctype="multipart/form-data">
            <div class="mb-3">
                <input class="form-control" type="file" name="file" id="file" accept="image/*" required>
            </div>
            <button type="submit" class="btn btn-primary">Predict</button>
        </form>

        <!-- Loading Indicator -->
        <div class="loader" id="loading">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Processing...</span>
            </div>
            <p>Processing...</p>
        </div>

        <!-- Display Uploaded Image and Prediction -->
        {% if image_path %}
            <div class="mt-4">
                <h4>Uploaded Image:</h4>
                <img src="{{ image_path }}" class="img-fluid" style="max-width: 300px;">
                <h3 class="mt-3">Predicted Class: <span class="text-success">{{ prediction }}</span></h3>
            </div>
        {% endif %}

        {% if error %}
            <div class="alert alert-danger mt-3">{{ error }}</div>
        {% endif %}
    </div>

    <!-- JavaScript to Show Loading Indicator -->
    <script>
        document.getElementById("upload-form").onsubmit = function() {
            document.getElementById("loading").style.display = "block";
        };
    </script>
</body>
</html>
